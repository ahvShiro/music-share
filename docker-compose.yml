services:
  postgres-db:
    image: postgres
    container_name: music-share-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=music-share-db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: